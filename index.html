<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PWA Starter</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">

<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PWA Starter">

<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app-header">
  <h1>To-Do</h1>
  <p id="status" class="status" aria-live="polite"></p>
</header>

<main>
  <form id="add-form" class="add-form">
    <input id="new-item" type="text" placeholder="Add a task…" autocomplete="off" required>
    <button type="submit">Add</button>
  </form>

  <ul id="list" class="list"></ul>
  <p id="empty" class="empty">No tasks yet — add one above.</p>
</main>

<script src="app.js"></script>
</body>
</html>
