<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PWA Starter</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">

<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PWA Starter">

<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app-header">
  <h1>To-Do</h1>
  <p id="status" class="status" aria-live="polite"></p>
</header>

<section class="auth-section">
  <h2>Google Account</h2>
  <p id="auth-status" class="status" aria-live="polite">Not signed in</p>
  <div class="auth-actions">
    <button id="signin-btn" type="button" class="btn">Sign in with Google</button>
    <button id="signout-btn" type="button" class="btn btn-secondary hidden">Sign out</button>
    <button id="list-files-btn" type="button" class="btn btn-secondary hidden">List Drive files</button>
  </div>
  <ul id="drive-files" class="list"></ul>
</section>

<main>
  <form id="add-form" class="add-form">
    <input id="new-item" type="text" placeholder="Add a task…" autocomplete="off" required>
    <button type="submit">Add</button>
  </form>

  <ul id="list" class="list"></ul>
  <p id="empty" class="empty">No tasks yet — add one above.</p>
</main>

<script src="https://accounts.google.com/gsi/client" defer></script>
<script src="app.js" defer></script>
</body>
</html>
